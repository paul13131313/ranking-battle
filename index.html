<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking Battle — リアルタイムチャット</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 1.2rem;
      border-bottom: 1px solid #1e1e1e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .nickname {
      font-size: 0.75rem;
      color: #888;
      background: #1a1a1a;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      border: 1px solid #2a2a2a;
    }

    .nickname span {
      color: #4895EF;
      font-weight: 700;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .msg {
      max-width: 85%;
      padding: 0.6rem 0.9rem;
      border-radius: 12px;
      font-size: 0.875rem;
      line-height: 1.5;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.other {
      background: #1a1a1a;
      border: 1px solid #252525;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.mine {
      background: #1a3a5c;
      border: 1px solid #254a70;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .msg-name {
      font-size: 0.7rem;
      font-weight: 700;
      margin-bottom: 0.15rem;
    }

    .msg.other .msg-name { color: #e8a04c; }
    .msg.mine .msg-name { color: #4895EF; }

    .msg-text {
      word-break: break-word;
    }

    .msg-time {
      font-size: 0.6rem;
      color: #555;
      margin-top: 0.2rem;
      text-align: right;
    }

    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      font-size: 0.8rem;
    }

    .input-area {
      padding: 0.8rem 1rem;
      border-top: 1px solid #1e1e1e;
      display: flex;
      gap: 0.5rem;
      flex-shrink: 0;
      background: #0e0e0e;
    }

    .input-area input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #e0e0e0;
      padding: 0.65rem 0.9rem;
      border-radius: 10px;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-area input:focus {
      border-color: #4895EF;
    }

    .input-area button {
      background: #4895EF;
      color: #fff;
      border: none;
      padding: 0 1.2rem;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .input-area button:hover { background: #3a7bd5; }
    .input-area button:active { transform: scale(0.96); }
    .input-area button:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>

  <header>
    <h1>⚔️ Ranking Battle</h1>
    <div class="nickname">あなた: <span id="my-name"></span></div>
  </header>

  <div class="messages" id="messages">
    <div class="empty">メッセージがありません。最初の一言を送ろう！</div>
  </div>

  <div class="input-area">
    <input type="text" id="input" placeholder="メッセージを入力..." autocomplete="off" />
    <button id="send" disabled>送信</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://equkrfpjlvovkzsmztwl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Pl_UoNLCNidZzW4z0Ou1Sw_U-sXIzfq';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ランダムニックネーム生成
    const adjectives = ['最強の', '伝説の', '光速の', '無敵の', '孤高の', '漆黒の', '覚醒した', '不屈の', '天才', '爆速の', '静かなる', '情熱の', '鋼の', '疾風の', '紅蓮の'];
    const nouns = ['戦士', 'ランカー', 'チャレンジャー', '賢者', '勇者', '審判者', '探求者', '支配者', '冒険者', '守護者', '破壊者', '観測者', '創造者', '旅人', '剣士'];

    function generateNickname() {
      const saved = localStorage.getItem('ranking-battle-name');
      if (saved) return saved;
      const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
      const noun = nouns[Math.floor(Math.random() * nouns.length)];
      const name = adj + noun;
      localStorage.setItem('ranking-battle-name', name);
      return name;
    }

    const myName = generateNickname();
    document.getElementById('my-name').textContent = myName;

    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    let hasMessages = false;

    function formatTime(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
    }

    function appendMessage(msg) {
      if (!hasMessages) {
        messagesEl.innerHTML = '';
        hasMessages = true;
      }
      const isMine = msg.nickname === myName;
      const div = document.createElement('div');
      div.className = `msg ${isMine ? 'mine' : 'other'}`;
      div.innerHTML = `
        <div class="msg-name">${msg.nickname}</div>
        <div class="msg-text">${escapeHtml(msg.content)}</div>
        <div class="msg-time">${formatTime(msg.created_at)}</div>
      `;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 既存メッセージを読み込み
    async function loadMessages() {
      const { data } = await supabase
        .from('battle_messages')
        .select('*')
        .order('created_at', { ascending: true })
        .limit(100);

      if (data && data.length > 0) {
        data.forEach(appendMessage);
      }
    }

    // Realtime購読
    function subscribeRealtime() {
      supabase
        .channel('battle_messages_realtime')
        .on('postgres_changes', {
          event: 'INSERT',
          schema: 'public',
          table: 'battle_messages',
        }, (payload) => {
          appendMessage(payload.new);
        })
        .subscribe();
    }

    // メッセージ送信
    async function sendMessage() {
      const content = inputEl.value.trim();
      if (!content) return;

      sendBtn.disabled = true;
      inputEl.value = '';

      await supabase.from('battle_messages').insert({
        nickname: myName,
        content: content,
      });

      sendBtn.disabled = false;
      inputEl.focus();
    }

    inputEl.addEventListener('input', () => {
      sendBtn.disabled = !inputEl.value.trim();
    });

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing && inputEl.value.trim()) {
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    // 初期化
    loadMessages();
    subscribeRealtime();
  </script>
</body>
</html>
