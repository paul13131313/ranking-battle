<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — MY RANKING</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0c;
      --bg-card: #141418;
      --bg-hover: #1a1a20;
      --border: #2a2a32;
      --text: #e8e6e3;
      --text-muted: #8a8890;
      --accent: #f0c040;
      --accent-dim: rgba(240, 192, 64, 0.12);
      --success: #40c080;
      --danger: #e05050;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0;
    }

    .admin-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }

    /* Header */
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .admin-header-left {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
    }

    .admin-logo {
      font-family: Georgia, serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent);
    }

    .admin-badge {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--bg);
      background: var(--accent);
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .admin-refresh-info {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    #refreshTimer {
      color: var(--accent);
      font-weight: 600;
    }

    /* KPI Cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    @media (max-width: 640px) {
      .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      transition: border-color 0.2s;
    }

    .kpi-card:hover {
      border-color: #3a3a44;
    }

    .kpi-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .kpi-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      font-family: Georgia, serif;
    }

    .kpi-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .kpi-sub .highlight {
      color: var(--success);
      font-weight: 600;
    }

    /* Section */
    .section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .section-title {
      font-family: Georgia, serif;
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: var(--accent);
    }

    /* Chart */
    .chart-wrap {
      position: relative;
      height: 280px;
    }

    /* Activity Table */
    .activity-table {
      width: 100%;
      border-collapse: collapse;
    }

    .activity-table th {
      text-align: left;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }

    .activity-table td {
      padding: 0.6rem 0.75rem;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .activity-table tr:last-child td {
      border-bottom: none;
    }

    .activity-table tr:hover td {
      background: var(--bg-hover);
    }

    .activity-type {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .activity-type.favorite {
      background: var(--accent-dim);
      color: var(--accent);
    }

    .activity-type.user_registered {
      background: rgba(64, 192, 128, 0.12);
      color: var(--success);
    }

    .activity-time {
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    /* Users table */
    .users-table {
      width: 100%;
      border-collapse: collapse;
    }

    .users-table th {
      text-align: left;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }

    .users-table td {
      padding: 0.5rem 0.75rem;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--border);
    }

    .users-table tr:last-child td {
      border-bottom: none;
    }

    .users-table tr:hover td {
      background: var(--bg-hover);
    }

    .user-handle {
      color: var(--accent);
      font-weight: 500;
    }

    .user-public {
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 4px;
    }

    .user-public.yes {
      background: rgba(64, 192, 128, 0.12);
      color: var(--success);
    }

    .user-public.no {
      background: rgba(224, 80, 80, 0.12);
      color: var(--danger);
    }

    /* Loading */
    .loading-text {
      text-align: center;
      color: var(--text-muted);
      padding: 2rem;
      font-size: 0.9rem;
    }

    /* Scrollable */
    .table-scroll {
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div class="admin-wrap">
    <!-- Header -->
    <div class="admin-header">
      <div class="admin-header-left">
        <a href="index.html" class="admin-logo" style="text-decoration:none">MY RANKING</a>
        <span class="admin-badge">Admin</span>
      </div>
      <div class="admin-refresh-info">
        次の更新まで <span id="refreshTimer">30</span>秒
      </div>
    </div>

    <!-- Navigation -->
    <div style="display:flex;gap:.75rem;margin-bottom:1.5rem;flex-wrap:wrap">
      <a href="index.html" style="font-size:.8rem;color:var(--accent);text-decoration:none;padding:.4rem .8rem;border:1px solid var(--border);border-radius:8px">🏠 ポータル</a>
      <a href="status.html" style="font-size:.8rem;color:var(--text-muted);text-decoration:none;padding:.4rem .8rem;border:1px solid var(--border);border-radius:8px">🔍 Status</a>
      <a href="https://my5-6s3d.vercel.app" style="font-size:.8rem;color:var(--text-muted);text-decoration:none;padding:.4rem .8rem;border:1px solid var(--border);border-radius:8px">🏆 MY5 App</a>
      <a href="battle.html" style="font-size:.8rem;color:var(--text-muted);text-decoration:none;padding:.4rem .8rem;border:1px solid var(--border);border-radius:8px">⚔️ Battle</a>
    </div>

    <!-- KPI Cards -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">カテゴリ数</div>
        <div class="kpi-value" id="kpiCategories">-</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">ランキングアイテム</div>
        <div class="kpi-value" id="kpiItems">-</div>
        <div class="kpi-sub">今日: <span class="highlight" id="kpiNewItems">-</span></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">1位アイテム数</div>
        <div class="kpi-value" id="kpiRank1">-</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">平均アイテム/カテゴリ</div>
        <div class="kpi-value" id="kpiAvg">-</div>
      </div>
    </div>

    <!-- Chart -->
    <div class="section">
      <div class="section-title">カテゴリ別アイテム数</div>
      <div class="chart-wrap">
        <canvas id="categoryChart"></canvas>
      </div>
    </div>

    <!-- Activity -->
    <div class="section">
      <div class="section-title">最新アクティビティ</div>
      <div id="activityArea">
        <div class="loading-text">読み込み中...</div>
      </div>
    </div>

    <!-- Categories -->
    <div class="section">
      <div class="section-title">カテゴリ詳細</div>
      <div id="categoriesArea">
        <div class="loading-text">読み込み中...</div>
      </div>
    </div>
  </div>

  <script>
    const API = 'https://my-ranking-api.hiroshinagano0113.workers.dev';
    let categoryChart = null;
    let countdown = 30;

    // Timer
    setInterval(() => {
      countdown--;
      document.getElementById('refreshTimer').textContent = countdown;
      if (countdown <= 0) {
        countdown = 30;
        loadAll();
      }
    }, 1000);

    function formatTime(ts) {
      if (!ts) return '-';
      const d = new Date(ts);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mi = String(d.getMinutes()).padStart(2, '0');
      return `${mm}/${dd} ${hh}:${mi}`;
    }

    function formatDate(ts) {
      if (!ts) return '-';
      const d = new Date(ts);
      return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
    }

    async function loadStats() {
      try {
        const res = await fetch(`${API}/admin/stats`);
        const data = await res.json();

        document.getElementById('kpiCategories').textContent = data.totalCategories;
        document.getElementById('kpiItems').textContent = data.totalRankingItems;
        document.getElementById('kpiNewItems').textContent = `+${data.newItemsToday}`;
        document.getElementById('kpiRank1').textContent = data.rankDistribution?.['1'] || 0;
        const avg = data.totalCategories > 0
          ? (data.totalRankingItems / data.totalCategories).toFixed(1)
          : '0';
        document.getElementById('kpiAvg').textContent = avg;

        // Chart
        const labels = data.categoryItemCounts.map(c => `${c.icon} ${c.name}`);
        const counts = data.categoryItemCounts.map(c => c.count);

        if (categoryChart) {
          categoryChart.data.labels = labels;
          categoryChart.data.datasets[0].data = counts;
          categoryChart.update();
        } else {
          const ctx = document.getElementById('categoryChart').getContext('2d');
          categoryChart = new Chart(ctx, {
            type: 'bar',
            data: {
              labels,
              datasets: [{
                label: 'アイテム数',
                data: counts,
                backgroundColor: 'rgba(240, 192, 64, 0.25)',
                borderColor: 'rgba(240, 192, 64, 0.8)',
                borderWidth: 1,
                borderRadius: 6,
              }],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
              },
              scales: {
                x: {
                  ticks: { color: '#8a8890', font: { size: 11 } },
                  grid: { color: '#2a2a32' },
                },
                y: {
                  beginAtZero: true,
                  ticks: {
                    color: '#8a8890',
                    font: { size: 11 },
                    stepSize: 1,
                  },
                  grid: { color: '#2a2a32' },
                },
              },
            },
          });
        }
      } catch (e) {
        console.error('Stats error:', e);
      }
    }

    async function loadActivity() {
      try {
        const res = await fetch(`${API}/admin/activity`);
        const data = await res.json();
        const activities = data.activities || [];

        if (activities.length === 0) {
          document.getElementById('activityArea').innerHTML =
            '<div class="loading-text">アクティビティがありません</div>';
          return;
        }

        let html = `<div class="table-scroll"><table class="activity-table">
          <thead><tr>
            <th>種別</th>
            <th>カテゴリ</th>
            <th>内容</th>
            <th>順位</th>
            <th>日時</th>
          </tr></thead><tbody>`;

        for (const a of activities) {
          const typeLabel = a.type === 'created' ? '新規' : '更新';
          const typeClass = a.type === 'created' ? 'user_registered' : 'favorite';

          html += `<tr>
            <td><span class="activity-type ${typeClass}">${typeLabel}</span></td>
            <td>${a.category_icon} ${a.category_name}</td>
            <td>${a.title}</td>
            <td>${a.rank}位</td>
            <td><span class="activity-time">${formatTime(a.timestamp)}</span></td>
          </tr>`;
        }

        html += '</tbody></table></div>';
        document.getElementById('activityArea').innerHTML = html;
      } catch (e) {
        console.error('Activity error:', e);
      }
    }

    async function loadCategories() {
      try {
        const res = await fetch(`${API}/admin/users`);
        const data = await res.json();
        const categories = data.categories || [];

        if (categories.length === 0) {
          document.getElementById('categoriesArea').innerHTML =
            '<div class="loading-text">カテゴリがありません</div>';
          return;
        }

        let html = `<div class="table-scroll"><table class="users-table">
          <thead><tr>
            <th>カテゴリ</th>
            <th>アイテム数</th>
            <th>トップ3</th>
          </tr></thead><tbody>`;

        for (const c of categories) {
          const top3 = c.top3.map(t => `${t.rank}位 ${t.title}`).join('、') || '-';

          html += `<tr>
            <td><span class="user-handle">${c.icon} ${c.name}</span></td>
            <td>${c.items_count}</td>
            <td>${top3}</td>
          </tr>`;
        }

        html += '</tbody></table></div>';
        document.getElementById('categoriesArea').innerHTML = html;
      } catch (e) {
        console.error('Categories error:', e);
      }
    }

    function loadAll() {
      countdown = 30;
      loadStats();
      loadActivity();
      loadCategories();
    }

    loadAll();
  </script>
</body>
</html>
